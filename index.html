<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GeoMaster Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <style>
    :root {
      --bg: #090a0f;
      --panel: rgba(22, 27, 34, 0.88);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --correct: #10b981;
      --wrong: #ef4444;
      --land-fill: #1e293b;
      --land-stroke: #334155;
      --land-hover: #3b82f6;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    #app-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #map-svg {
      width: 100%;
      height: 100%;
      flex: 1;
      display: block;
      cursor: grab;
      background: radial-gradient(circle at center, #111827 0%, #090a0f 100%);
    }

    #map-svg:active {
      cursor: grabbing;
    }

    .glass {
      background: var(--panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    /* Top HUD */
    #hud-top {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      z-index: 20;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .stat-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-val {
      font-size: 16px;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-lbl {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    /* Target Prompt */
    #target-container {
      position: absolute;
      top: 80px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 28px;
      text-align: center;
      z-index: 20;
      min-width: 260px;
      pointer-events: none;
    }

    #target-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 2px;
    }

    #target-name {
      font-size: 20px;
      font-weight: 800;
      color: #fff;
    }

    /* Map Paths */
    .land {
      fill: var(--land-fill);
      stroke: var(--land-stroke);
      stroke-width: 0.8px;
      transition: fill 0.2s, stroke 0.2s;
      cursor: pointer;
    }

    .land:hover {
      fill: var(--land-hover);
    }

    .land.correct {
      fill: var(--correct) !important;
      stroke: #059669;
    }

    .land.wrong-flash {
      fill: var(--wrong) !important;
    }

    .capital-circle {
      fill: #f59e0b;
      stroke: #fff;
      stroke-width: 1.5px;
      cursor: pointer;
      transition: transform 0.2s, fill 0.2s;
    }

    .capital-circle:hover {
      fill: #ef4444;
      transform: scale(1.3);
    }

    /* UI Buttons & Controls */
    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--accent);
    }

    .controls-overlay {
      position: absolute;
      bottom: 24px;
      right: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 20;
    }

    .ctrl-btn {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      font-weight: bold;
    }

    /* Modals & Dialogs */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 10, 15, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-content {
      width: 100%;
      max-width: 440px;
      padding: 28px 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .modal-title {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .modal-subtitle {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .lang-switcher {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 10px;
      margin: 0 auto;
      gap: 4px;
      border: 1px solid var(--border);
    }

    .lang-opt {
      padding: 6px 16px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .lang-opt.active {
      background: var(--accent);
      color: #000;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 6px;
    }

    .mode-btn {
      padding: 14px 10px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .mode-btn.full-width {
      grid-column: span 2;
    }

    #loading-indicator {
      display: none;
      font-size: 13px;
      color: var(--accent);
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <div id="app-container">
    <!-- Top HUD -->
    <div id="hud-top" class="glass">
      <div class="hud-group">
        <button id="btn-menu" class="btn">☰ <span id="lbl-menu">Menu</span></button>
      </div>
      <div class="hud-group">
        <div class="stat-badge">
          <span id="stat-progress" class="stat-val">0/0</span>
          <span id="lbl-progress" class="stat-lbl">Progresso</span>
        </div>
        <div class="stat-badge">
          <span id="stat-errors" class="stat-val" style="color: var(--wrong);">0</span>
          <span id="lbl-errors" class="stat-lbl">Errori</span>
        </div>
        <div class="stat-badge">
          <span id="stat-timer" class="stat-val">00:00</span>
          <span id="lbl-time" class="stat-lbl">Tempo</span>
        </div>
      </div>
    </div>

    <!-- Target Display -->
    <div id="target-container" class="glass">
      <div id="target-label">Trova:</div>
      <div id="target-name">---</div>
    </div>

    <!-- Map SVG Container -->
    <svg id="map-svg"></svg>

    <!-- Map Zoom Controls -->
    <div class="controls-overlay">
      <button id="zoom-in" class="btn ctrl-btn glass">+</button>
      <button id="zoom-out" class="btn ctrl-btn glass">−</button>
      <button id="zoom-reset" class="btn ctrl-btn glass">⟲</button>
    </div>

    <!-- Menu Modal -->
    <div id="menu-modal" class="modal-overlay">
      <div class="modal-content glass">
        <div class="modal-title">GeoMaster Pro</div>
        <div class="modal-subtitle" id="menu-desc">
          Seleziona la lingua e la modalità di gioco per iniziare.
        </div>

        <div class="lang-switcher">
          <div class="lang-opt active" data-lang="it">Italiano</div>
          <div class="lang-opt" data-lang="en">English</div>
        </div>

        <div class="mode-grid">
          <button class="mode-btn" data-mode="europe">🌍 Europa / Europe</button>
          <button class="mode-btn" data-mode="asia">🌏 Asia</button>
          <button class="mode-btn" data-mode="africa">🌍 Africa</button>
          <button class="mode-btn" data-mode="americas">🌎 Americhe / Americas</button>
          <button class="mode-btn" data-mode="oceania">🌏 Oceania</button>
          <button class="mode-btn" data-mode="world">🌐 Mondo / World</button>
          <button class="mode-btn full-width" data-mode="italy">🇮🇹 Italia: Capoluoghi Regionali</button>
        </div>

        <div id="loading-indicator">Caricamento mappa in corso...</div>
      </div>
    </div>

    <!-- End Game Modal -->
    <div id="end-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content glass">
        <div class="modal-title" id="end-title">Vittoria!</div>
        <div class="modal-subtitle" id="end-stats">Hai completato la mappa!</div>
        <button id="btn-replay" class="btn" style="justify-content: center; padding: 12px; margin-top: 10px;">
          Gioca Ancora
        </button>
      </div>
    </div>
  </div>

  <script>
    // Localized Strings
    const I18N = {
      it: {
        menu: "Menu",
        trova: "Trova:",
        progresso: "Progresso",
        errori: "Errori",
        tempo: "Tempo",
        desc: "Seleziona la lingua e la modalità di gioco per iniziare.",
        vittoria: "Complimenti!",
        completato: "Mappa completata in {time} con {errors} errori.",
        rigioca: "Torna al Menu",
        loading: "Caricamento dati mappa..."
      },
      en: {
        menu: "Menu",
        trova: "Locate:",
        progresso: "Progress",
        errori: "Errors",
        tempo: "Time",
        desc: "Choose a game mode and test your geography skills.",
        vittoria: "Well Done!",
        completato: "Completed in {time} with {errors} errors.",
        rigioca: "Return to Menu",
        loading: "Loading map data..."
      }
    };

    // Regional Capitals of Italy
    const ITALIAN_CAPITALS = [
      { id: "AO", name_it: "Aosta", name_en: "Aosta", coords: [7.313, 45.737] },
      { id: "TO", name_it: "Torino", name_en: "Turin", coords: [7.686, 45.070] },
      { id: "GE", name_it: "Genova", name_en: "Genoa", coords: [8.946, 44.405] },
      { id: "MI", name_it: "Milano", name_en: "Milan", coords: [9.190, 45.464] },
      { id: "TN", name_it: "Trento", name_en: "Trento", coords: [11.121, 46.074] },
      { id: "VE", name_it: "Venezia", name_en: "Venice", coords: [12.315, 45.440] },
      { id: "TS", name_it: "Trieste", name_en: "Trieste", coords: [13.776, 45.649] },
      { id: "BO", name_it: "Bologna", name_en: "Bologna", coords: [11.342, 44.494] },
      { id: "FI", name_it: "Firenze", name_en: "Florence", coords: [11.255, 43.769] },
      { id: "AN", name_it: "Ancona", name_en: "Ancona", coords: [13.518, 43.615] },
      { id: "PG", name_it: "Perugia", name_en: "Perugia", coords: [12.390, 43.110] },
      { id: "RM", name_it: "Roma", name_en: "Rome", coords: [12.496, 41.902] },
      { id: "AQ", name_it: "L'Aquila", name_en: "L'Aquila", coords: [13.399, 42.349] },
      { id: "CB", name_it: "Campobasso", name_en: "Campobasso", coords: [14.656, 41.560] },
      { id: "NA", name_it: "Napoli", name_en: "Naples", coords: [14.268, 40.851] },
      { id: "BA", name_it: "Bari", name_en: "Bari", coords: [16.871, 41.117] },
      { id: "PZ", name_it: "Potenza", name_en: "Potenza", coords: [15.805, 40.640] },
      { id: "CZ", name_it: "Catanzaro", name_en: "Catanzaro", coords: [16.587, 38.909] },
      { id: "PA", name_it: "Palermo", name_en: "Palermo", coords: [13.361, 38.115] },
      { id: "CA", name_it: "Cagliari", name_en: "Cagliari", coords: [9.121, 39.223] }
    ];

    // State Variables
    let currentLang = "it";
    let currentMode = "europe";
    let cachedWorldData = null;
    let cachedItalyGeo = null;
    let activeTargets = [];
    let currentTarget = null;
    let scoreErrors = 0;
    let scoreCompleted = 0;
    let totalTargetCount = 0;
    let timerInterval = null;
    let startTime = null;

    // SVG & D3 Projections
    const svg = d3.select("#map-svg");
    const gMap = svg.append("g").attr("id", "map-group");
    const zoomBehavior = d3.zoom().scaleExtent([0.8, 20]).on("zoom", (e) => gMap.attr("transform", e.transform));
    svg.call(zoomBehavior);

    // Zoom Controls
    document.getElementById("zoom-in").addEventListener("click", () => svg.transition().duration(250).call(zoomBehavior.scaleBy, 1.3));
    document.getElementById("zoom-out").addEventListener("click", () => svg.transition().duration(250).call(zoomBehavior.scaleBy, 0.7));
    document.getElementById("zoom-reset").addEventListener("click", resetZoom);

    function resetZoom() {
      svg.transition().duration(350).call(zoomBehavior.transform, d3.zoomIdentity);
    }

    // Language Toggle
    document.querySelectorAll(".lang-opt").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".lang-opt").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentLang = btn.dataset.lang;
        updateLanguageUI();
      });
    });

    function updateLanguageUI() {
      const strings = I18N[currentLang];
      document.getElementById("lbl-menu").innerText = strings.menu;
      document.getElementById("target-label").innerText = strings.trova;
      document.getElementById("lbl-progress").innerText = strings.progresso;
      document.getElementById("lbl-errors").innerText = strings.errori;
      document.getElementById("lbl-time").innerText = strings.tempo;
      document.getElementById("menu-desc").innerText = strings.desc;
      document.getElementById("btn-replay").innerText = strings.rigioca;
      if (currentTarget) {
        document.getElementById("target-name").innerText = currentTarget["name_" + currentLang] || currentTarget.name;
      }
    }

    // Modal Triggers
    document.getElementById("btn-menu").addEventListener("click", () => {
      document.getElementById("menu-modal").style.display = "flex";
      clearInterval(timerInterval);
    });

    document.getElementById("btn-replay").addEventListener("click", () => {
      document.getElementById("end-modal").style.display = "none";
      document.getElementById("menu-modal").style.display = "flex";
    });

    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentMode = btn.dataset.mode;
        startGame(currentMode);
      });
    });

    // Start Game Handler
    async function startGame(mode) {
      const loading = document.getElementById("loading-indicator");
      loading.innerText = I18N[currentLang].loading;
      loading.style.display = "block";

      try {
        if (mode === "italy") {
          await renderItalyMap();
        } else {
          await renderWorldMap(mode);
        }
        document.getElementById("menu-modal").style.display = "none";
        initGameStats();
      } catch (err) {
        console.error("Errore caricamento mappa:", err);
        alert("Errore nel download dei dati della mappa. Verifica la connessione.");
      } finally {
        loading.style.display = "none";
      }
    }

    // Render Italy Game
    async function renderItalyMap() {
      gMap.selectAll("*").remove();
      const rect = svg.node().getBoundingClientRect();
      const width = rect.width || window.innerWidth;
      const height = rect.height || window.innerHeight;

      if (!cachedItalyGeo) {
        // High quality fallback GeoJSON of Italian regions
        const res = await fetch("https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_regions.geojson");
        cachedItalyGeo = await res.json();
      }

      const projection = d3.geoMercator().fitExtent([[30, 90], [width - 30, height - 30]], cachedItalyGeo);
      const pathGenerator = d3.geoPath().projection(projection);

      // Render Region Outlines
      gMap.selectAll("path.land")
        .data(cachedItalyGeo.features)
        .enter()
        .append("path")
        .attr("class", "land")
        .attr("d", pathGenerator)
        .style("pointer-events", "none");

      // Setup Capitals as Target Points
      activeTargets = [...ITALIAN_CAPITALS];
      totalTargetCount = activeTargets.length;

      // Render Interactive Capital Dots
      gMap.selectAll("circle.capital")
        .data(ITALIAN_CAPITALS)
        .enter()
        .append("circle")
        .attr("class", "capital-circle")
        .attr("r", 7)
        .attr("cx", d => projection(d.coords)[0])
        .attr("cy", d => projection(d.coords)[1])
        .attr("id", d => "target-" + d.id)
        .on("click", (e, d) => handleTargetClick(d.id, e.target));

      resetZoom();
    }

    // Render World / Continental Game
    async function renderWorldMap(mode) {
      gMap.selectAll("*").remove();
      const rect = svg.node().getBoundingClientRect();
      const width = rect.width || window.innerWidth;
      const height = rect.height || window.innerHeight;

      if (!cachedWorldData) {
        const res = await fetch("https://unpkg.com/world-atlas@2.0.2/countries-50m.json");
        cachedWorldData = await res.json();
      }

      let features = topojson.feature(cachedWorldData, cachedWorldData.objects.countries).features;

      // Continental ISO Partition Map
      const continentCodes = {
        europe: ["008","020","040","056","100","191","203","208","233","246","250","276","300","348","352","372","380","428","440","442","498","499","528","578","616","620","642","643","688","703","705","724","752","756","804","807","826"],
        asia: ["004","050","064","104","116","156","356","360","364","368","376","392","398","400","408","410","414","417","418","422","458","462","496","512","524","586","608","634","682","702","760","762","764","792","795","860","704"],
        africa: ["012","024","120","132","178","204","262","288","324","384","404","430","434","478","504","508","516","562","566","686","710","728","729","768","788","800","818","834","894"],
        americas: ["028","032","068","076","124","152","170","188","192","218","222","254","320","332","340","388","484","558","591","600","604","740","840","858","862"],
        oceania: ["036","554","598","090","242","296","583","584","585"]
      };

      if (mode !== "world" && continentCodes[mode]) {
        const allowed = new Set(continentCodes[mode]);
        features = features.filter(f => allowed.has(String(f.id).padStart(3, "0")));
      }

      // Name mappings for key countries
      const nameAtlas = {
        "380": { it: "Italia", en: "Italy" },
        "250": { it: "Francia", en: "France" },
        "276": { it: "Germania", en: "Germany" },
        "724": { it: "Spagna", en: "Spain" },
        "826": { it: "Regno Unito", en: "United Kingdom" },
        "756": { it: "Svizzera", en: "Switzerland" },
        "040": { it: "Austria", en: "Austria" },
        "620": { it: "Portogallo", en: "Portugal" },
        "300": { it: "Grecia", en: "Greece" },
        "528": { it: "Paesi Bassi", en: "Netherlands" },
        "056": { it: "Belgio", en: "Belgium" },
        "616": { it: "Polonia", en: "Poland" },
        "752": { it: "Svezia", en: "Sweden" },
        "578": { it: "Norvegia", en: "Norway" },
        "246": { it: "Finlandia", en: "Finland" },
        "804": { it: "Ucraina", en: "Ukraine" },
        "643": { it: "Russia", en: "Russia" },
        "792": { it: "Turchia", en: "Turkey" },
        "840": { it: "Stati Uniti", en: "United States" },
        "124": { it: "Canada", en: "Canada" },
        "484": { it: "Messico", en: "Mexico" },
        "076": { it: "Brasile", en: "Brazil" },
        "032": { it: "Argentina", en: "Argentina" },
        "156": { it: "Cina", en: "China" },
        "392": { it: "Giappone", en: "Japan" },
        "356": { it: "India", en: "India" },
        "036": { it: "Australia", en: "Australia" },
        "818": { it: "Egitto", en: "Egypt" },
        "710": { it: "Sudafrica", en: "South Africa" }
      };

      const projection = d3.geoMercator().fitExtent([[20, 80], [width - 20, height - 30]], { type: "FeatureCollection", features: features });
      const pathGenerator = d3.geoPath().projection(projection);

      activeTargets = [];
      features.forEach(f => {
        const idStr = String(f.id).padStart(3, "0");
        const entry = nameAtlas[idStr] || { it: f.properties.name || "Territorio " + idStr, en: f.properties.name || "Territory " + idStr };
        activeTargets.push({
          id: idStr,
          name_it: entry.it,
          name_en: entry.en
        });
      });

      totalTargetCount = activeTargets.length;

      gMap.selectAll("path.land")
        .data(features)
        .enter()
        .append("path")
        .attr("class", "land")
        .attr("d", pathGenerator)
        .attr("id", d => "target-" + String(d.id).padStart(3, "0"))
        .on("click", (e, d) => handleTargetClick(String(d.id).padStart(3, "0"), e.target));

      resetZoom();
    }

    // Logic for Turns & Validation
    function initGameStats() {
      scoreErrors = 0;
      scoreCompleted = 0;
      document.getElementById("stat-errors").innerText = "0";
      document.getElementById("stat-progress").innerText = `0/${totalTargetCount}`;

      startTime = Date.now();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(elapsed / 60)).padStart(2, "0");
        const s = String(elapsed % 60).padStart(2, "0");
        document.getElementById("stat-timer").innerText = `${m}:${s}`;
      }, 1000);

      pickNextTarget();
    }

    function pickNextTarget() {
      if (activeTargets.length === 0) {
        endGame();
        return;
      }
      const idx = Math.floor(Math.random() * activeTargets.length);
      currentTarget = activeTargets[idx];
      document.getElementById("target-name").innerText = currentTarget["name_" + currentLang];
    }

    function handleTargetClick(id, element) {
      if (!currentTarget) return;

      if (id === currentTarget.id) {
        // Correct
        element.classList.add("correct");
        scoreCompleted++;
        activeTargets = activeTargets.filter(t => t.id !== id);
        document.getElementById("stat-progress").innerText = `${scoreCompleted}/${totalTargetCount}`;
        pickNextTarget();
      } else {
        // Mistake
        scoreErrors++;
        document.getElementById("stat-errors").innerText = scoreErrors;
        element.classList.add("wrong-flash");
        setTimeout(() => element.classList.remove("wrong-flash"), 450);
      }
    }

    function endGame() {
      clearInterval(timerInterval);
      const strings = I18N[currentLang];
      const timerStr = document.getElementById("stat-timer").innerText;
      document.getElementById("end-title").innerText = strings.vittoria;
      document.getElementById("end-stats").innerText = strings.completato
        .replace("{time}", timerStr)
        .replace("{errors}", scoreErrors);
      document.getElementById("end-modal").style.display = "flex";
    }

    // Window Resize Handling
    window.addEventListener("resize", () => {
      if (!document.getElementById("menu-modal").style.display || document.getElementById("menu-modal").style.display === "none") {
        if (currentMode === "italy") renderItalyMap();
        else renderWorldMap(currentMode);
      }
    });

    // Initialize labels on first load
    updateLanguageUI();
  </script>
</body>
</html>
