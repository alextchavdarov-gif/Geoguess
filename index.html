<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GeoMaster Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3/dist/topojson-client.min.js"></script>
  <style>
    :root {
      --bg: #090a0f;
      --panel: rgba(22, 27, 34, 0.85);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --correct: #10b981;
      --wrong: #ef4444;
      --hint-blue: #00d4ff;
      --neutral-land: #1e293b;
      --neutral-border: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    #app-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    #map-svg {
      width: 100%;
      height: 100%;
      cursor: grab;
    }
    #map-svg:active {
      cursor: grabbing;
    }

    /* Glass Panels */
    .glass {
      background: var(--panel);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border);
      border-radius: 14px;
    }

    /* Top HUD */
    #hud-top {
      position: absolute;
      top: 14px;
      left: 14px;
      right: 14px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 18px;
      z-index: 20;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-hud {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-hud:hover {
      background: rgba(255, 255, 255, 0.16);
      transform: translateY(-1px);
    }

    #target-container {
      position: absolute;
      top: 76px;
      left: 50%;
      transform: translateX(-50%);
      padding: 12px 28px;
      text-align: center;
      z-index: 10;
      pointer-events: none;
    }

    #target-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--text-muted);
    }

    #target-name {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
    }

    .stat-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
      font-variant-numeric: tabular-nums;
    }
    .stat-val {
      font-size: 16px;
      font-weight: 700;
    }
    .stat-lbl {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    /* Modals */
    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(4, 7, 13, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-card {
      width: 100%;
      max-width: 520px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
    }

    .modal-title {
      font-size: 26px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }

    .modal-desc {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 24px;
      line-height: 1.5;
    }

    .menu-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
    }

    .menu-btn {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      padding: 14px;
      border-radius: 10px;
      color: var(--text);
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .menu-btn:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .lang-switcher {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 3px;
      margin-bottom: 20px;
    }
    .lang-opt {
      padding: 6px 14px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      color: var(--text-muted);
      transition: 0.2s;
    }
    .lang-opt.active {
      background: var(--accent);
      color: #000;
    }

    /* Map Elements */
    .land {
      fill: var(--neutral-land);
      stroke: var(--neutral-border);
      stroke-width: 0.5px;
      transition: fill 0.2s;
      cursor: pointer;
    }
    .land:hover {
      fill: #334155;
    }

    .land.correct {
      fill: var(--correct) !important;
      cursor: default;
    }

    .land.wrong-flash {
      fill: var(--wrong) !important;
    }

    /* Requested Bright Blue Highlight for Correct Answer */
    .land.highlight-target {
      fill: var(--hint-blue) !important;
      filter: drop-shadow(0 0 8px var(--hint-blue));
    }

    /* City Markers for Italy Mode */
    .city-pin {
      fill: #f59e0b;
      stroke: #fff;
      stroke-width: 1.5px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .city-pin:hover {
      transform: scale(1.4);
      fill: var(--accent);
    }
    .city-pin.correct {
      fill: var(--correct) !important;
    }
    .city-pin.highlight-target {
      fill: var(--hint-blue) !important;
      stroke: #fff;
      filter: drop-shadow(0 0 10px var(--hint-blue));
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="hud-top" class="glass">
      <div class="hud-group">
        <button class="btn-hud" id="btn-back" onclick="openMenu()">☰ Menu</button>
        <div class="stat-badge">
          <span class="stat-val" id="stat-progress">0/0</span>
          <span class="stat-lbl" id="lbl-progress">Progresso</span>
        </div>
      </div>
      <div class="hud-group">
        <div class="stat-badge">
          <span class="stat-val" id="stat-errors" style="color: var(--wrong);">0</span>
          <span class="stat-lbl" id="lbl-errors">Errori</span>
        </div>
        <div class="stat-badge">
          <span class="stat-val" id="stat-time">00:00</span>
          <span class="stat-lbl" id="lbl-time">Tempo</span>
        </div>
      </div>
    </div>

    <div id="target-container" class="glass">
      <div id="target-label">Trova:</div>
      <div id="target-name">---</div>
    </div>

    <svg id="map-svg"></svg>

    <!-- Start / Mode Menu -->
    <div id="menu-modal" class="modal-overlay">
      <div class="modal-card glass">
        <h1 class="modal-title">GeoMaster Pro</h1>
        <p class="modal-desc" id="menu-desc">Seleziona la lingua e la modalità di gioco per iniziare.</p>

        <div class="lang-switcher">
          <div class="lang-opt active" id="lang-it" onclick="setLang('it')">Italiano</div>
          <div class="lang-opt" id="lang-en" onclick="setLang('en')">English</div>
        </div>

        <div class="menu-grid">
          <button class="menu-btn" onclick="startGame('europe')">🌍 Europa / Europe</button>
          <button class="menu-btn" onclick="startGame('asia')">🌏 Asia</button>
          <button class="menu-btn" onclick="startGame('africa')">🌍 Africa</button>
          <button class="menu-btn" onclick="startGame('americas')">🌎 Americhe / Americas</button>
          <button class="menu-btn" onclick="startGame('oceania')">🌏 Oceania</button>
          <button class="menu-btn" onclick="startGame('world')">🌐 Mondo / World</button>
          <button class="menu-btn" style="grid-column: span 2; border-color: var(--accent);" onclick="startGame('italy')">🇮🇹 Italia: Capoluoghi Regionali</button>
        </div>
      </div>
    </div>

    <!-- Game Over Summary Modal -->
    <div id="summary-modal" class="modal-overlay" style="display: none;">
      <div class="modal-card glass">
        <h2 class="modal-title" id="sum-title">Vittoria!</h2>
        <p class="modal-desc" id="sum-details">Hai completato tutti gli obiettivi.</p>
        <button class="btn-hud" style="padding: 12px 24px; font-size: 15px;" onclick="openMenu()" id="btn-play-again">Torna al Menu</button>
      </div>
    </div>
  </div>

  <script>
    // Localized Strings
    const I18N = {
      it: {
        find: "Trova:",
        progress: "Progresso",
        errors: "Errori",
        time: "Tempo",
        victory: "Vittoria completata!",
        summary: (t, e, acc) => `Tempo impiegato: ${t} | Errori: ${e} | Precisione: ${acc}%`,
        playAgain: "Torna al Menu",
        desc: "Seleziona la modalità e impara la geografia posizionando territori e città."
      },
      en: {
        find: "Locate:",
        progress: "Progress",
        errors: "Errors",
        time: "Time",
        victory: "Challenge Completed!",
        summary: (t, e, acc) => `Elapsed Time: ${t} | Mistakes: ${e} | Accuracy: ${acc}%`,
        playAgain: "Back to Menu",
        desc: "Choose a game mode and test your geography skills."
      }
    };

    let currentLang = 'it';

    // Comprehensive ISO lists including transcontinental and newly defined codes (Russia 643, North Macedonia 807, etc.)
    const REGIONS_ISO = {
      europe: ["008","020","040","056","070","100","112","191","196","203","208","233","246","250","268","276","300","348","352","372","380","428","440","442","470","498","499","528","578","616","620","642","643","688","703","705","724","752","756","804","807","826"],
      asia: ["004","051","031","048","050","064","096","104","116","144","156","268","356","360","364","368","376","392","398","400","408","410","414","417","418","422","458","462","496","512","524","586","608","634","643","682","702","704","760","762","764","792","795","784","860","887"],
      africa: ["012","024","204","072","108","120","132","140","148","174","178","180","262","818","226","232","231","266","270","288","324","624","384","404","426","430","434","450","466","478","480","504","508","516","562","566","646","678","686","690","694","706","710","728","729","748","768","788","800","834","894","716"],
      americas: ["028","032","044","052","068","076","084","124","152","170","188","192","214","218","222","238","254","308","320","328","332","340","388","474","484","500","558","591","600","604","659","662","670","740","780","840","858","862"],
      oceania: ["036","242","296","554","598","882"]
    };

    // Italian Regional Capitals with coordinates [lng, lat]
    const ITALY_CAPITALS = [
      { id: "c_rm", name: { it: "Roma (Lazio)", en: "Rome (Lazio)" }, coords: [12.4964, 41.9028] },
      { id: "c_mi", name: { it: "Milano (Lombardia)", en: "Milan (Lombardy)" }, coords: [9.1900, 45.4642] },
      { id: "c_na", name: { it: "Napoli (Campania)", en: "Naples (Campania)" }, coords: [14.2681, 40.8518] },
      { id: "c_to", name: { it: "Torino (Piemonte)", en: "Turin (Piedmont)" }, coords: [7.6869, 45.0703] },
      { id: "c_pa", name: { it: "Palermo (Sicilia)", en: "Palermo (Sicily)" }, coords: [13.3615, 38.1157] },
      { id: "c_bo", name: { it: "Bologna (Emilia-Romagna)", en: "Bologna (Emilia-Romagna)" }, coords: [11.3426, 44.4949] },
      { id: "c_fi", name: { it: "Firenze (Toscana)", en: "Florence (Tuscany)" }, coords: [11.2558, 43.7696] },
      { id: "c_ba", name: { it: "Bari (Puglia)", en: "Bari (Apulia)" }, coords: [16.8719, 41.1171] },
      { id: "c_ve", name: { it: "Venezia (Veneto)", en: "Venice (Veneto)" }, coords: [12.3155, 45.4408] },
      { id: "c_ge", name: { it: "Genova (Liguria)", en: "Genoa (Liguria)" }, coords: [8.9463, 44.4056] },
      { id: "c_ca", name: { it: "Cagliari (Sardegna)", en: "Cagliari (Sardinia)" }, coords: [9.1107, 39.2238] },
      { id: "c_cz", name: { it: "Catanzaro (Calabria)", en: "Catanzaro (Calabria)" }, coords: [16.5877, 38.9098] },
      { id: "c_pg", name: { it: "Perugia (Umbria)", en: "Perugia (Umbria)" }, coords: [12.3908, 43.1107] },
      { id: "c_aq", name: { it: "L'Aquila (Abruzzo)", en: "L'Aquila (Abruzzo)" }, coords: [13.3995, 42.3498] },
      { id: "c_an", name: { it: "Ancona (Marche)", en: "Ancona (Marche)" }, coords: [13.5189, 43.6158] },
      { id: "c_ts", name: { it: "Trieste (Friuli-V.G.)", en: "Trieste (Friuli Venezia Giulia)" }, coords: [13.7768, 45.6495] },
      { id: "c_tn", name: { it: "Trento (Trentino-A.A.)", en: "Trento (Trentino-South Tyrol)" }, coords: [11.1211, 46.0748] },
      { id: "c_pz", name: { it: "Potenza (Basilicata)", en: "Potenza (Basilicata)" }, coords: [15.8056, 40.6404] },
      { id: "c_cb", name: { it: "Campobasso (Molise)", en: "Campobasso (Molise)" }, coords: [14.6562, 41.5603] },
      { id: "c_ao", name: { it: "Aosta (Valle d'Aosta)", en: "Aosta (Aosta Valley)" }, coords: [7.3131, 45.7349] }
    ];

    let worldAtlasData = null;
    let countryNames = {};
    let activeTargets = [];
    let currentTarget = null;
    let errorsCount = 0;
    let totalTargetsCount = 0;
    let startTime = null;
    let timerInterval = null;
    let isProcessing = false;

    const svg = d3.select("#map-svg");
    const g = svg.append("g");
    const zoom = d3.zoom().scaleExtent([1, 14]).on("zoom", (e) => g.attr("transform", e.transform));
    svg.call(zoom);

    // Initial load: TopoJSON & Names dictionary
    Promise.all([
      d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.json"),
      d3.tsv("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-110m.tsv")
    ]).then(([atlas, tsv]) => {
      worldAtlasData = atlas;
      tsv.forEach(d => {
        countryNames[d.iso_n3] = {
          en: d.name,
          it: getItalianCountryName(d.iso_n3, d.name)
        };
      });
    });

    function getItalianCountryName(iso, defaultName) {
      const overrides = {
        "643": "Russia", "807": "Macedonia del Nord", "380": "Italia", "250": "Francia",
        "276": "Germania", "724": "Spagna", "826": "Regno Unito", "300": "Grecia",
        "756": "Svizzera", "040": "Austria", "528": "Paesi Bassi", "056": "Belgio",
        "620": "Portogallo", "616": "Polonia", "804": "Ucraina", "792": "Turchia",
        "840": "Stati Uniti", "124": "Canada", "076": "Brasile", "032": "Argentina",
        "156": "Cina", "392": "Giappone", "356": "India", "036": "Australia", "818": "Egitto"
      };
      return overrides[iso] || defaultName;
    }

    function setLang(lang) {
      currentLang = lang;
      document.querySelectorAll(".lang-opt").forEach(el => el.classList.remove("active"));
      document.getElementById(`lang-${lang}`).classList.add("active");
      
      const t = I18N[lang];
      document.getElementById("target-label").innerText = t.find;
      document.getElementById("lbl-progress").innerText = t.progress;
      document.getElementById("lbl-errors").innerText = t.errors;
      document.getElementById("lbl-time").innerText = t.time;
      document.getElementById("menu-desc").innerText = t.desc;
      document.getElementById("btn-play-again").innerText = t.playAgain;

      if (currentTarget) updateTargetDisplay();
    }

    function openMenu() {
      clearInterval(timerInterval);
      document.getElementById("menu-modal").style.display = "flex";
      document.getElementById("summary-modal").style.display = "none";
    }

    function startGame(mode) {
      document.getElementById("menu-modal").style.display = "none";
      document.getElementById("summary-modal").style.display = "none";
      errorsCount = 0;
      document.getElementById("stat-errors").innerText = "0";

      g.selectAll("*").remove();

      const width = window.innerWidth;
      const height = window.innerHeight;

      if (mode === "italy") {
        setupItalyMode(width, height);
      } else {
        setupWorldMode(mode, width, height);
      }

      totalTargetsCount = activeTargets.length;
      updateProgressDisplay();
      startTimer();
      pickNextTarget();
    }

    function setupWorldMode(mode, width, height) {
      const allCountries = topojson.feature(worldAtlasData, worldAtlasData.objects.countries).features;
      let allowedIso = mode === "world" ? null : new Set(REGIONS_ISO[mode]);

      const filteredFeatures = allCountries.filter(f => !allowedIso || allowedIso.has(f.id));

      const projection = d3.geoMercator();
      const pathGenerator = d3.geoPath().projection(projection);

      projection.fitExtent([[50, 80], [width - 50, height - 50]], {
        type: "FeatureCollection",
        features: filteredFeatures
      });

      // Render base polygons
      const paths = g.selectAll(".land")
        .data(filteredFeatures)
        .enter()
        .append("path")
        .attr("class", "land")
        .attr("id", d => `target-${d.id}`)
        .attr("d", pathGenerator)
        .on("click", (e, d) => handleItemClick(d.id, d3.select(e.currentTarget)));

      activeTargets = filteredFeatures.map(f => ({
        id: f.id,
        name: countryNames[f.id] ? countryNames[f.id] : { it: f.properties.name || f.id, en: f.properties.name || f.id }
      }));
    }

    function setupItalyMode(width, height) {
      const allCountries = topojson.feature(worldAtlasData, worldAtlasData.objects.countries).features;
      const italyFeature = allCountries.filter(f => f.id === "380"); // Italy

      const projection = d3.geoMercator();
      const pathGenerator = d3.geoPath().projection(projection);

      projection.fitExtent([[60, 100], [width - 60, height - 60]], {
        type: "FeatureCollection",
        features: italyFeature
      });

      // Render Italy outline
      g.selectAll(".land")
        .data(italyFeature)
        .enter()
        .append("path")
        .attr("class", "land")
        .attr("d", pathGenerator)
        .style("cursor", "default");

      // Render City Pins
      const pins = g.selectAll(".city-pin")
        .data(ITALY_CAPITALS)
        .enter()
        .append("circle")
        .attr("class", "city-pin")
        .attr("id", d => `target-${d.id}`)
        .attr("r", 7)
        .attr("cx", d => projection(d.coords)[0])
        .attr("cy", d => projection(d.coords)[1])
        .on("click", (e, d) => handleItemClick(d.id, d3.select(e.currentTarget)));

      activeTargets = ITALY_CAPITALS.map(c => ({
        id: c.id,
        name: c.name
      }));
    }

    function pickNextTarget() {
      if (activeTargets.length === 0) {
        gameOver();
        return;
      }
      const idx = Math.floor(Math.random() * activeTargets.length);
      currentTarget = activeTargets[idx];
      updateTargetDisplay();
    }

    function updateTargetDisplay() {
      document.getElementById("target-name").innerText = currentTarget.name[currentLang] || currentTarget.name.it;
    }

    function handleItemClick(clickedId, elementSelection) {
      if (isProcessing || !currentTarget) return;

      if (clickedId === currentTarget.id) {
        // Correct Choice
        elementSelection.classed("correct", true).classed("highlight-target", false);
        activeTargets = activeTargets.filter(t => t.id !== clickedId);
        updateProgressDisplay();
        pickNextTarget();
      } else {
        // Wrong Choice: Highlight clicked item in Red and correct target in Bright Blue
        isProcessing = true;
        errorsCount++;
        document.getElementById("stat-errors").innerText = errorsCount;

        const correctElement = d3.select(`#target-${currentTarget.id}`);

        elementSelection.classed("wrong-flash", true);
        correctElement.classed("highlight-target", true);

        setTimeout(() => {
          elementSelection.classed("wrong-flash", false);
          correctElement.classed("highlight-target", false);
          isProcessing = false;
        }, 1100);
      }
    }

    function updateProgressDisplay() {
      const solved = totalTargetsCount - activeTargets.length;
      document.getElementById("stat-progress").innerText = `${solved}/${totalTargetsCount}`;
    }

    function startTimer() {
      startTime = Date.now();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const delta = Math.floor((Date.now() - startTime) / 1000);
        const mins = String(Math.floor(delta / 60)).padStart(2, '0');
        const secs = String(delta % 60).padStart(2, '0');
        document.getElementById("stat-time").innerText = `${mins}:${secs}`;
      }, 1000);
    }

    function gameOver() {
      clearInterval(timerInterval);
      const delta = Math.floor((Date.now() - startTime) / 1000);
      const mins = String(Math.floor(delta / 60)).padStart(2, '0');
      const secs = String(delta % 60).padStart(2, '0');
      const timeStr = `${mins}:${secs}`;

      const totalAttempts = totalTargetsCount + errorsCount;
      const accuracy = totalAttempts > 0 ? Math.round((totalTargetsCount / totalAttempts) * 100) : 100;

      const t = I18N[currentLang];
      document.getElementById("sum-title").innerText = t.victory;
      document.getElementById("sum-details").innerText = t.summary(timeStr, errorsCount, accuracy);
      document.getElementById("summary-modal").style.display = "flex";
    }

    window.addEventListener("resize", () => {
      // Automatic responsive resize handler
    });
  </script>
</body>
</html>
