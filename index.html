<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>GeoMaster Pro</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
  <script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js"></script>
  <style>
    :root {
      --bg: #0b0f19;
      --panel: rgba(17, 24, 39, 0.88);
      --border: rgba(255, 255, 255, 0.12);
      --accent: #38bdf8;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --correct: #10b981;
      --wrong: #ef4444;
      --reveal: #3b82f6;
      --land-fill: #1e293b;
      --land-stroke: #475569;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: var(--bg);
      color: var(--text);
    }

    #app-container {
      width: 100vw;
      height: 100vh;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #map-svg {
      width: 100%;
      height: 100%;
      flex: 1;
      display: block;
      cursor: grab;
      background: radial-gradient(circle at center, #111827 0%, #090a0f 100%);
    }

    #map-svg:active {
      cursor: grabbing;
    }

    .glass {
      background: var(--panel);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid var(--border);
      border-radius: 12px;
    }

    #hud-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 16px;
      z-index: 20;
    }

    .hud-group {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .stat-badge {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-val {
      font-size: 15px;
      font-weight: 700;
      color: var(--accent);
    }

    .stat-lbl {
      font-size: 9px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    #target-container {
      position: absolute;
      top: 72px;
      left: 50%;
      transform: translateX(-50%);
      padding: 10px 24px;
      text-align: center;
      z-index: 20;
      min-width: 240px;
      pointer-events: none;
    }

    #target-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    #target-name {
      font-size: 19px;
      font-weight: 800;
      color: #fff;
      margin-top: 2px;
    }

    .land {
      fill: var(--land-fill);
      stroke: var(--land-stroke);
      stroke-width: 0.7px;
      vector-effect: non-scaling-stroke;
      cursor: pointer;
      transition: fill 0.15s ease-out;
    }

    .land:hover {
      fill: #334155;
    }

    .land.correct {
      fill: var(--correct) !important;
      cursor: default;
    }

    .land.wrong-flash {
      fill: var(--wrong) !important;
    }

    .land.revealed {
      fill: var(--reveal) !important;
      animation: pulse-reveal 0.5s infinite alternate;
    }

    @keyframes pulse-reveal {
      from { fill: #2563eb; }
      to { fill: #60a5fa; }
    }

    .capital-marker {
      cursor: pointer;
      stroke-width: 1.5px;
      vector-effect: non-scaling-stroke;
      transition: r 0.2s;
    }

    .capital-marker.correct {
      fill: var(--correct) !important;
      stroke: #fff;
      cursor: default;
    }

    .capital-marker.revealed {
      fill: var(--reveal) !important;
      stroke: #fff;
      animation: pulse-dot 0.5s infinite alternate;
    }

    @keyframes pulse-dot {
      from { fill: #2563eb; }
      to { fill: #93c5fd; }
    }

    .btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .btn:hover {
      background: rgba(255, 255, 255, 0.16);
      border-color: var(--accent);
    }

    .controls-overlay {
      position: absolute;
      bottom: 20px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      z-index: 20;
    }

    .ctrl-btn {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: bold;
    }

    .modal-overlay {
      position: absolute;
      inset: 0;
      background: rgba(9, 10, 15, 0.88);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 20px;
    }

    .modal-content {
      width: 100%;
      max-width: 460px;
      padding: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .modal-title {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    .modal-subtitle {
      font-size: 12px;
      color: var(--text-muted);
      line-height: 1.4;
    }

    .lang-switcher {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.05);
      padding: 4px;
      border-radius: 10px;
      margin: 0 auto;
      gap: 4px;
      border: 1px solid var(--border);
    }

    .lang-opt {
      padding: 5px 14px;
      border-radius: 7px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      color: var(--text-muted);
      transition: all 0.2s;
    }

    .lang-opt.active {
      background: var(--accent);
      color: #000;
    }

    .mode-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .mode-btn {
      padding: 12px 8px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--border);
      color: var(--text);
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn:hover {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
      transform: translateY(-2px);
    }

    .mode-btn.full-width {
      grid-column: span 2;
    }

    #loading-indicator {
      display: none;
      font-size: 13px;
      color: var(--accent);
    }
  </style>
</head>
<body>
  <div id="app-container">
    <div id="hud-top" class="glass">
      <div class="hud-group">
        <button id="btn-menu" class="btn">☰ <span id="lbl-menu">Menu</span></button>
      </div>
      <div class="hud-group">
        <div class="stat-badge">
          <span id="stat-progress" class="stat-val">0/0</span>
          <span id="lbl-progress" class="stat-lbl">Progresso</span>
        </div>
        <div class="stat-badge">
          <span id="stat-errors" class="stat-val" style="color: var(--wrong);">0</span>
          <span id="lbl-errors" class="stat-lbl">Errori</span>
        </div>
        <div class="stat-badge">
          <span id="stat-timer" class="stat-val">00:00</span>
          <span id="lbl-time" class="stat-lbl">Tempo</span>
        </div>
      </div>
    </div>

    <div id="target-container" class="glass">
      <div id="target-label">Trova:</div>
      <div id="target-name">---</div>
    </div>

    <svg id="map-svg"></svg>

    <div class="controls-overlay">
      <button id="zoom-in" class="btn ctrl-btn glass">+</button>
      <button id="zoom-out" class="btn ctrl-btn glass">−</button>
      <button id="zoom-reset" class="btn ctrl-btn glass">⟲</button>
    </div>

    <div id="menu-modal" class="modal-overlay">
      <div class="modal-content glass">
        <div class="modal-title">GeoMaster Pro</div>
        <div class="modal-subtitle" id="menu-desc">
          Seleziona lingua e modalità di gioco.
        </div>

        <div class="lang-switcher">
          <div class="lang-opt active" data-lang="it">Italiano</div>
          <div class="lang-opt" data-lang="en">English</div>
          <div class="lang-opt" data-lang="bg">Български</div>
        </div>

        <div class="mode-grid">
          <button class="mode-btn" data-mode="europe" id="m-europe">🌍 Europa</button>
          <button class="mode-btn" data-mode="usa" id="m-usa">🇺🇸 50 Stati USA</button>
          <button class="mode-btn" data-mode="asia" id="m-asia">🌏 Asia</button>
          <button class="mode-btn" data-mode="africa" id="m-africa">🌍 Africa</button>
          <button class="mode-btn" data-mode="americas" id="m-americas">🌎 Americhe</button>
          <button class="mode-btn" data-mode="world" id="m-world">🌐 Mondo</button>
          <button class="mode-btn full-width" data-mode="italy" id="m-italy">🇮🇹 Italia: Città e Province</button>
        </div>

        <div id="loading-indicator">Caricamento mappa in corso...</div>
      </div>
    </div>

    <div id="end-modal" class="modal-overlay" style="display: none;">
      <div class="modal-content glass">
        <div class="modal-title" id="end-title">Vittoria!</div>
        <div class="modal-subtitle" id="end-stats">Partita terminata!</div>
        <button id="btn-replay" class="btn" style="justify-content: center; padding: 12px; margin-top: 10px;">
          Rigioca
        </button>
      </div>
    </div>
  </div>

      { id: "SA", it: "Salerno", en: "Salerno", bg: "Салерно", coords: [14.768, 40.682] },
      { id: "BA", it: "Bari", en: "Bari", bg: "Бари", coords: [16.871, 41.117] },
      { id: "LE", it: "Lecce", en: "Lecce", bg: "Лече", coords: [18.174, 40.354] },
      { id: "PZ", it: "Potenza", en: "Potenza", bg: "Потенца", coords: [15.805, 40.640] },
      { id: "MT", it: "Matera", en: "Matera", bg: "Матера", coords: [16.604, 40.666] },
      { id: "CZ", it: "Catanzaro", en: "Catanzaro", bg: "Катандзаро", coords: [16.587, 38.909] },
      { id: "RC", it: "Reggio Calabria", en: "Reggio Calabria", bg: "Реджо Калабрия", coords: [15.651, 38.111] },
      { id: "PA", it: "Palermo", en: "Palermo", bg: "Палермо", coords: [13.361, 38.115] },
      { id: "CT", it: "Catania", en: "Catania", bg: "Катания", coords: [15.087, 37.507] },
      { id: "ME", it: "Messina", en: "Messina", bg: "Месина", coords: [15.555, 38.193] },
      { id: "CA", it: "Cagliari", en: "Cagliari", bg: "Каляри", coords: [9.121, 39.223] },
      { id: "SS", it: "Sassari", en: "Sassari", bg: "Сасари", coords: [8.555, 40.725] }
    ];

    let currentLang = "it";
    let currentMode = "europe";
    let cachedWorldData = null;
    let cachedUsaData = null;
    let cachedItalyGeo = null;

    let queue = [];
    let currentTarget = null;
    let scoreErrors = 0;
    let scoreCompleted = 0;
    let totalTargetCount = 0;
    let solvedIds = new Set();
    let timerInterval = null;
    let startTime = null;
    let isProcessing = false;

    const svg = d3.select("#map-svg");
    const gMap = svg.append("g").attr("id", "map-group");
    const zoomBehavior = d3.zoom().scaleExtent([0.6, 25]).on("zoom", (e) => gMap.attr("transform", e.transform));
    svg.call(zoomBehavior);

    document.getElementById("zoom-in").addEventListener("click", () => svg.transition().duration(200).call(zoomBehavior.scaleBy, 1.4));
    document.getElementById("zoom-out").addEventListener("click", () => svg.transition().duration(200).call(zoomBehavior.scaleBy, 0.7));
    document.getElementById("zoom-reset").addEventListener("click", resetZoom);

    function resetZoom() {
      svg.transition().duration(300).call(zoomBehavior.transform, d3.zoomIdentity);
    }

    // Gestione Lingue
    document.querySelectorAll(".lang-opt").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".lang-opt").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentLang = btn.dataset.lang;
        updateLanguageUI();
      });
    });

    function updateLanguageUI() {
      const strings = I18N[currentLang];
      document.getElementById("lbl-menu").innerText = strings.menu;
      document.getElementById("target-label").innerText = strings.trova;
      document.getElementById("lbl-progress").innerText = strings.progresso;
      document.getElementById("lbl-errors").innerText = strings.errori;
      document.getElementById("lbl-time").innerText = strings.tempo;
      document.getElementById("menu-desc").innerText = strings.desc;
      document.getElementById("btn-replay").innerText = strings.rigioca;

      document.getElementById("m-europe").innerText = strings.modes.europe;
      document.getElementById("m-usa").innerText = strings.modes.usa;
      document.getElementById("m-asia").innerText = strings.modes.asia;
      document.getElementById("m-africa").innerText = strings.modes.africa;
      document.getElementById("m-americas").innerText = strings.modes.americas;
      document.getElementById("m-world").innerText = strings.modes.world;
      document.getElementById("m-italy").innerText = strings.modes.italy;

      if (currentTarget) {
        document.getElementById("target-name").innerText = currentTarget[currentLang];
      }
    }

    document.getElementById("btn-menu").addEventListener("click", () => {
      document.getElementById("menu-modal").style.display = "flex";
      clearInterval(timerInterval);
    });

    document.getElementById("btn-replay").addEventListener("click", () => {
      document.getElementById("end-modal").style.display = "none";
      document.getElementById("menu-modal").style.display = "flex";
    });

    document.querySelectorAll(".mode-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        currentMode = btn.dataset.mode;
        startGame(currentMode);
      });
    });

    async function startGame(mode) {
      const loader = document.getElementById("loading-indicator");
      loader.innerText = I18N[currentLang].loading;
      loader.style.display = "block";

      try {
        if (mode === "italy") {
          await renderItalyMap();
        } else if (mode === "usa") {
          await renderUsaMap();
        } else {
          await renderWorldMap(mode);
        }
        document.getElementById("menu-modal").style.display = "none";
        initGameStats();
      } catch (err) {
        console.error(err);
        alert("Errore nel caricamento dei dati della mappa.");
      } finally {
        loader.style.display = "none";
      }
    }

    // Modalità Italia Estesa
    async function renderItalyMap() {
      gMap.selectAll("*").remove();
      const rect = svg.node().getBoundingClientRect();
      const width = rect.width || window.innerWidth;
      const height = rect.height || window.innerHeight;

      if (!cachedItalyGeo) {
        const res = await fetch("https://raw.githubusercontent.com/openpolis/geojson-italy/master/geojson/limits_IT_regions.geojson");
        cachedItalyGeo = await res.json();
      }

      const projection = d3.geoMercator().fitExtent([[25, 80], [width - 25, height - 30]], cachedItalyGeo);
      const pathGenerator = d3.geoPath().projection(projection);

      gMap.selectAll("path.land")
        .data(cachedItalyGeo.features)
        .enter()
        .append("path")
        .attr("class", "land")
        .attr("d", pathGenerator)
        .style("pointer-events", "none");

      queue = [...EXTENDED_ITALIAN_CITIES].sort(() => Math.random() - 0.5);
      totalTargetCount = queue.length;
      solvedIds.clear();

      const markerLayer = gMap.append("g").attr("id", "markers-layer");

      markerLayer.selectAll("circle.capital-marker")
        .data(EXTENDED_ITALIAN_CITIES)
        .enter()
        .append("circle")
        .attr("class", "capital-marker")
        .attr("id", d => `target-${d.id}`)
        .attr("cx", d => projection(d.coords)[0])
        .attr("cy", d => projection(d.coords)[1])
        .attr("r", 5)
        .attr("fill", "#f59e0b")
        .attr("stroke", "#090a0f")
        .on("click", (e, d) => handleGuess(d.id));

      resetZoom();
    }

    // Modalità 50 Stati USA
    async function renderUsaMap() {
      gMap.selectAll("*").remove();
      const rect = svg.node().getBoundingClientRect();
      const width = rect.width || window.innerWidth;
      const height = rect.height || window.innerHeight;

      if (!cachedUsaData) {
        const res = await fetch("https://cdn.jsdelivr.net/npm/us-atlas@3/states-10m.json");
        cachedUsaData = await res.json();
      }

      const states = topojson.feature(cachedUsaData, cachedUsaData.objects.states).features;
      const validStates = states.filter(s => US_STATES_MAP[String(s.id).padStart(2, "0")]);

      const projection = d3.geoAlbersUsa().fitExtent([[25, 80], [width - 25, height - 30]], {
        type: "FeatureCollection",
        features: validStates
      });
      const pathGenerator = d3.geoPath().projection(projection);

      queue = [];
      validStates.forEach(s => {
        const id = String(s.id).padStart(2, "0");
        const meta = US_STATES_MAP[id];
        queue.push({ id: id, it: meta.it, en: meta.en, bg: meta.bg });
      });

      queue.sort(() => Math.random() - 0.5);
      totalTargetCount = queue.length;
      solvedIds.clear();

      gMap.selectAll("path.land")
        .data(validStates)
        .enter()
        .append("path")
        .attr("class", "land")
        .attr("id", d => `target-${String(d.id).padStart(2, "0")}`)
        .attr("d", pathGenerator)
        .on("click", (e, d) => handleGuess(String(d.id).padStart(2, "0")));

      resetZoom();
    }

    // Modalità Mondo / Europa
    async function renderWorldMap(mode) {
      gMap.selectAll("*").remove();
      const rect = svg.node().getBoundingClientRect();
      const width = rect.width || window.innerWidth;
      const height = rect.height || window.innerHeight;

      if (!cachedWorldData) {
        const res = await fetch("https://unpkg.com/world-atlas@2.0.2/countries-50m.json");
        cachedWorldData = await res.json();
      }

      let features = topojson.feature(cachedWorldData, cachedWorldData.objects.countries).features;

      // Lista Europa Continentale pulita (esclusi microstati e isole minori)
      const europeIso = new Set([
        "008","040","056","070","100","112","191","203","208","233","246","250",
        "276","300","348","372","380","428","440","442","498","499",
        "528","578","616","620","642","688","703","705","724","752","756","804","807","826","-99"
      ]);

      if (mode === "europe") {
        features = features.filter(f => europeIso.has(String(f.id).padStart(3, "0")) || europeIso.has(String(f.id)));
      } else if (mode !== "world") {
        const continentCodes = {
          asia: ["004","050","064","104","116","156","356","360","364","368","376","392","398","400","408","410","414","417","418","422","458","462","496","512","524","586","608","634","682","702","760","762","764","792","795","860","704"],
          africa: ["012","024","120","132","178","204","262","288","324","384","404","430","434","478","504","508","516","562","566","686","710","728","729","768","788","800","818","834","894"],
          americas: ["028","032","068","076","124","152","170","188","192","218","222","254","320","332","340","388","484","558","591","600","604","740","840","858","862"],
          oceania: ["036","554","598","090","242","296","583","584","585"]
        };
        const allowed = new Set(continentCodes[mode] || []);
        features = features.filter(f => allowed.has(String(f.id).padStart(3, "0")));
      }

      const projection = d3.geoMercator().fitExtent([[20, 80], [width - 20, height - 30]], {
        type: "FeatureCollection",
        features: features
      });
      const pathGenerator = d3.geoPath().projection(projection);

      queue = [];
      features.forEach(f => {
        const id = String(f.id).padStart(3, "0");
        const meta = COUNTRY_NAMES[id] || { it: f.properties?.name || id, en: f.properties?.name || id, bg: f.properties?.name || id };
        queue.push({ id: id, it: meta.it, en: meta.en, bg: meta.bg });
      });

      queue.sort(() => Math.random() - 0.5);
      totalTargetCount = queue.length;
      solvedIds.clear();

      gMap.selectAll("path.land")
        .data(features)
        .enter()
        .append("path")
        .attr("class", "land")
        .attr("id", d => `target-${String(d.id).padStart(3, "0")}`)
        .attr("d", pathGenerator)
        .on("click", (e, d) => handleGuess(String(d.id).padStart(3, "0")));

      resetZoom();
    }

    function initGameStats() {
      scoreErrors = 0;
      scoreCompleted = 0;
      isProcessing = false;
      document.getElementById("stat-errors").innerText = "0";
      document.getElementById("stat-progress").innerText = `0/${totalTargetCount}`;

      startTime = Date.now();
      clearInterval(timerInterval);
      timerInterval = setInterval(() => {
        const elapsed = Math.floor((Date.now() - startTime) / 1000);
        const m = String(Math.floor(elapsed / 60)).padStart(2, "0");
        const s = String(elapsed % 60).padStart(2, "0");
        document.getElementById("stat-timer").innerText = `${m}:${s}`;
      }, 1000);

      nextTarget();
    }

    function nextTarget() {
      if (queue.length === 0) {
        endGame();
        return;
      }
      currentTarget = queue.shift();
      document.getElementById("target-name").innerText = currentTarget[currentLang];
      isProcessing = false;
    }

    function handleGuess(clickedId) {
      if (!currentTarget || isProcessing) return;

      // Se l'elemento è già stato indovinato (è verde), ignora il clic senza penalità
      if (solvedIds.has(clickedId)) return;

      const clickedEl = document.getElementById(`target-${clickedId}`);
      const correctEl = document.getElementById(`target-${currentTarget.id}`);

      if (clickedId === currentTarget.id) {
        // Corretto
        solvedIds.add(clickedId);
        if (clickedEl) clickedEl.classList.add("correct");
        scoreCompleted++;
        document.getElementById("stat-progress").innerText = `${scoreCompleted}/${totalTargetCount}`;
        nextTarget();
      } else {
        // Errato: conta errore, lampeggia in blu il target corretto per 2s e rimettilo in fondo alla coda
        isProcessing = true;
        scoreErrors++;
        document.getElementById("stat-errors").innerText = scoreErrors;

        if (clickedEl) {
          clickedEl.classList.add("wrong-flash");
          setTimeout(() => clickedEl.classList.remove("wrong-flash"), 350);
        }

        if (correctEl) {
          correctEl.classList.add("revealed");
        }

        // Si rimette il paese mancato in coda per farlo uscire di nuovo
        queue.push(currentTarget);

        setTimeout(() => {
          if (correctEl) correctEl.classList.remove("revealed");
          nextTarget();
        }, 2000);
      }
    }

    function endGame() {
      clearInterval(timerInterval);
      const strings = I18N[currentLang];
      const timerStr = document.getElementById("stat-timer").innerText;
      document.getElementById("end-title").innerText = strings.vittoria;
      document.getElementById("end-stats").innerText = strings.completato
        .replace("{time}", timerStr)
        .replace("{errors}", scoreErrors);
      document.getElementById("end-modal").style.display = "flex";
    }

    window.addEventListener("resize", () => {
      const modal = document.getElementById("menu-modal");
      if (modal.style.display === "none") {
        if (currentMode === "italy") renderItalyMap();
        else if (currentMode === "usa") renderUsaMap();
        else renderWorldMap(currentMode);
      }
    });

    updateLanguageUI();
  </script>
